<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Surprise for Kayla</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at top, #a4e9bf, #eafaf1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #ffffff;
    color: #1f2d27;
    border-radius: 24px;
    padding: 2.5rem 2rem;
    max-width: 440px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.8rem; }
  p { font-size: 1rem; opacity: 0.85; margin-bottom: 1.5rem; }
  .emoji { font-size: 3rem; margin-bottom: 1rem; }
  .bar-outer {
    background: #e0e0e0;
    border-radius: 10px;
    height: 18px;
    width: 100%;
    overflow: hidden;
    margin-bottom: 0.8rem;
  }
  .bar-inner {
    background: #2ecc71;
    height: 100%;
    width: 0%;
    border-radius: 10px;
    transition: width 0.2s linear;
  }
  .status { font-size: 0.95rem; opacity: 0.8; min-height: 1.5rem; }
  button {
    border: none;
    background: #2ecc71;
    color: white;
    padding: 1rem 2.2rem;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1rem;
  }
  button:active { transform: scale(0.96); }
  .hidden { display: none; }
  .message { font-size: 1.25rem; line-height: 1.6; font-weight: 600; }
</style>
</head>
<body>

<div class="card" id="screen1">
  <div class="emoji">🔍</div>
  <h1>Device Scan</h1>
  <p>Checking everything on this phone...</p>
  <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
  <div class="status" id="status">Starting scan...</div>
</div>

<div class="card hidden" id="screen2">
  <div class="emoji">💚🤗</div>
  <p class="message">
    Scan complete!<br><br>
    Good news, Kayla — everything is safe.<br>
    We only found <u>1 missing hug</u> from your favorite sibling.<br><br>
    Sending it now... ❤️
  </p>
  <button onclick="document.body.innerHTML='<div style=\'text-align:center;margin-top:40vh;font-family:sans-serif;color:#2ecc71;font-size:2.2rem\'>🤗💚</div>';">Receive Hug</button>
</div>

<script>
  const steps = [
    "Checking apps...",
    "Checking photos...",
    "Checking messages...",
    "Checking love levels...",
    "Almost done..."
  ];
  let progress = 0;
  let stepIndex = 0;
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');

  const interval = setInterval(() => {
    progress += 2;
    bar.style.width = progress + '%';

    const newStep = Math.floor(progress / (100 / steps.length));
    if (newStep < steps.length && newStep !== stepIndex) {
      stepIndex = newStep;
      status.textContent = steps[stepIndex];
    }

    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => {
        document.getElementById('screen1').classList.add('hidden');
        document.getElementById('screen2').classList.remove('hidden');
      }, 500);
    }
  }, 60);
</script>

</body>
</html>
